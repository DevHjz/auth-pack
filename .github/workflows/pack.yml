name: Build and Sign APK

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-sign-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # 1. 拉取代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 配置 Node.js（Expo 依赖）
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. 配置 JDK（构建 APK 依赖）
      - name: Set up JDK 18
        uses: actions/setup-java@v4
        with:
          java-version: '18'
          distribution: 'temurin'

      # 4. 提前创建 android 目录（避免路径错误）
      - name: Create android directory
        run: mkdir -p android

      # 5. 解码自定义 keystore 文件（从 Secrets 读取）
      - name: Decode Keystore from Secrets
        run: |
          # 解码到绝对路径，避免任何路径问题
          KEYSTORE_FILE="/home/runner/work/auth-pack/auth-pack/android/my-release-key.keystore"
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "${KEYSTORE_FILE}"
          # 设置只读权限，保证安全
          chmod 600 "${KEYSTORE_FILE}"
          # 验证文件生成成功
          if [ ! -f "${KEYSTORE_FILE}" ]; then
            echo "ERROR: Keystore 文件生成失败！"
            exit 1
          fi
          echo "✅ Keystore 文件生成成功：${KEYSTORE_FILE}"

      # 6. 安装依赖 + 生成原生代码（仅构建未签名 APK）
      - name: Install dependencies & Prebuild
        run: |
          npm cache clean --force
          npm install
          # 生成原生代码（--clean 清缓存）
          npx expo prebuild --platform android --clean
          # 验证原生代码生成
          if [ ! -d "android/app" ]; then
            echo "ERROR: Android 原生代码生成失败！"
            exit 1
          fi

      # 7. 构建未签名的 Release APK（禁用 Gradle 签名）
      - name: Build unsigned Release APK
        run: |
          cd android
          # 赋予 gradlew 执行权限
          chmod +x gradlew
          # 构建未签名 APK（跳过 Gradle 签名配置）
          ./gradlew assembleRelease --no-daemon -Dorg.gradle.jvmargs=-Xmx2048m
          # 验证未签名 APK 生成
          UNSIGNED_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          if [ ! -f "${UNSIGNED_APK}" ]; then
            echo "ERROR: 未签名 APK 构建失败！"
            exit 1
          fi
          echo "✅ 未签名 APK 构建成功：${UNSIGNED_APK}"

      # 8. 用 apksigner 手动签名（核心步骤，绕开 Gradle 坑）
      - name: Sign APK with apksigner
        run: |
          # 定义路径
          KEYSTORE_FILE="/home/runner/work/auth-pack/auth-pack/android/my-release-key.keystore"
          UNSIGNED_APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          SIGNED_APK="android/app/build/outputs/apk/release/HCV-authenticator.apk"
          
          # 找到 apksigner 工具（Android SDK 自带）
          APKSIGNER=$(find $ANDROID_HOME -name apksigner | head -1)
          if [ -z "${APKSIGNER}" ]; then
            echo "ERROR: apksigner 工具未找到！"
            exit 1
          fi

          # 执行签名（官方工具，100% 稳定）
          "${APKSIGNER}" sign \
            --ks "${KEYSTORE_FILE}" \
            --ks-pass pass:"${{ secrets.KEYSTORE_PASSWORD }}" \
            --key-pass pass:"${{ secrets.KEY_PASSWORD }}" \
            --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
            --out "${SIGNED_APK}" \
            "${UNSIGNED_APK}"

          # 验证签名是否成功
          "${APKSIGNER}" verify "${SIGNED_APK}"
          if [ $? -eq 0 ]; then
            echo "✅ APK 签名成功：${SIGNED_APK}"
          else
            echo "ERROR: APK 签名失败！"
            exit 1
          fi

      # 9. 上传签名后的最终 APK
      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: HCV-authenticator.apk
          path: android/app/build/outputs/apk/release/HCV-authenticator.apk
          retention-days: 90

      # 10. 安全清理敏感文件（必做）
      - name: Cleanup sensitive files
        if: always()
        run: |
          rm -f /home/runner/work/auth-pack/auth-pack/android/my-release-key.keystore
          echo "✅ 敏感文件已清理"

name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps: 
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 18
        uses: actions/setup-java@v4
        with:
          java-version: 18
          distribution: temurin

      # 新增：先创建android目录（解决路径不存在问题）
      - name: Create android directory
        run: mkdir -p android

      # 步骤1：从 Secrets 解码生成 keystore 文件（适配Ubuntu环境）
      - name: Decode Keystore from Secrets
        run: |
          # 把Base64编码解码为keystore文件，存到android目录
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/your_keystore.keystore
          # 给文件添加可读权限（Ubuntu必需）
          chmod 600 android/your_keystore.keystore

      # 步骤2：创建Gradle签名配置文件（无需修改项目原有build.gradle）
      - name: Create Signing Config File
        run: |
          cat > android/signing.properties << EOF
          storeFile=your_keystore.keystore
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      # 步骤3：安装依赖+强制重新生成原生代码（确保配置生效）
      - name: Install Dependencies & Prebuild
        run: |
          npm install && npx expo prebuild --platform android --clean

      # 关键新增：向生成的build.gradle注入签名配置（解决--clean覆盖问题）
      - name: Inject Signing Config to build.gradle
        run: |
          cd android/app
          # 向build.gradle末尾追加签名配置逻辑，确保读取signing.properties
          cat >> build.gradle << 'EOF'

          android {
              signingConfigs {
                  release {
                      def propsFile = project.rootProject.file("signing.properties")
                      if (propsFile.exists()) {
                          def props = new Properties()
                          props.load(new FileInputStream(propsFile))
                          storeFile file(props.getProperty("storeFile"))
                          storePassword props.getProperty("storePassword")
                          keyAlias props.getProperty("keyAlias")
                          keyPassword props.getProperty("keyPassword")
                      }
                  }
              }
              buildTypes {
                  release {
                      // 强制使用自定义签名配置
                      signingConfig signingConfigs.release
                      // 保留Expo默认的混淆等配置
                      minifyEnabled false
                  }
              }
          }
          EOF

      # 步骤4：构建带签名的Release版APK
      - name: Build Signed APK
        run: |
          cd android
          # 执行签名构建，读取外部配置文件
          ./gradlew assembleRelease -PsigningProperties=signing.properties
          # 重命名签名后的APK
          mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/HCV-authenticator.apk

      # 步骤5：上传签名后的APK产物
      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: HCV-authenticator.apk
          path: android/app/build/outputs/apk/release/HCV-authenticator.apk

      # 步骤6：清理临时文件（安全加固，可选但推荐）
      - name: Clean Up
        if: always()
        run: |
          rm -f android/your_keystore.keystore
          rm -f android/signing.properties

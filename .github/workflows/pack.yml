name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build-apk:
    runs-on: ubuntu-latest
    # 增加构建超时保护（避免卡壳）
    timeout-minutes: 30
    steps: 
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # 缓存npm依赖（提速，不影响逻辑）
          cache: 'npm'

      - name: Set up JDK 18
        uses: actions/setup-java@v4
        with:
          java-version: 18
          distribution: temurin
          # 缓存JDK依赖（提速）
          cache: 'gradle'

      # 步骤1：创建android目录（兼容首次构建）
      - name: Create android directory
        run: mkdir -p android
        # 即使失败也不终止（极端情况目录已存在）
        continue-on-error: true

      # 步骤2：解码Keystore并验证（核心安全+路径校验）
      - name: Decode & Verify Keystore
        run: |
          # 解码Keystore到绝对路径（避免相对路径歧义）
          KEYSTORE_PATH=$(realpath android/your_keystore.keystore)
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "${KEYSTORE_PATH}"
          # 设置安全权限（仅当前用户可读）
          chmod 600 "${KEYSTORE_PATH}"
          # 强制校验文件是否生成（失败则终止）
          if [ ! -f "${KEYSTORE_PATH}" ]; then
            echo "ERROR: Keystore file not generated!"
            exit 1
          fi
          # 打印文件大小（验证完整性，不泄露内容）
          echo "Keystore file size: $(du -h "${KEYSTORE_PATH}")"

      # 步骤3：生成签名配置文件（绝对路径+语法校验）
      - name: Create Signing Config
        run: |
          KEYSTORE_PATH=$(realpath android/your_keystore.keystore)
          # 生成配置文件（用EOF闭合，避免符号转义问题）
          cat > android/signing.properties << 'EOF'
          storeFile=${KEYSTORE_PATH}
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF
          # 替换变量（解决EOF单引号无法解析变量的问题）
          sed -i "s|\${KEYSTORE_PATH}|${KEYSTORE_PATH}|g" android/signing.properties
          # 校验配置文件（失败则终止）
          if [ ! -f android/signing.properties ]; then
            echo "ERROR: Signing config file not generated!"
            exit 1
          fi
          # 打印配置（隐藏密码，仅验证路径）
          cat android/signing.properties | sed -e "s/storePassword.*/storePassword=******/" -e "s/keyPassword.*/keyPassword=******/"

      # 步骤4：安装依赖+清理重建原生代码（核心缓存规避）
      - name: Install Dependencies & Prebuild
        run: |
          # 强制清理npm缓存（避免依赖冲突）
          npm cache clean --force
          npm install
          # 强制重建android目录（确保配置最新）
          npx expo prebuild --platform android --clean
          # 验证android/app目录是否生成
          if [ ! -d "android/app" ]; then
            echo "ERROR: Android app directory not generated!"
            exit 1
          fi

      # 步骤5：注入Gradle签名配置（Groovy语法100%正确）
      - name: Inject Signing Config to build.gradle
        run: |
          cd android/app
          # 注入签名配置（Groovy语法严格校验）
          cat >> build.gradle << 'EOF'
          android {
              // 确保签名配置在buildTypes之前加载
              signingConfigs {
                  release {
                      def propsFile = project.rootProject.file("signing.properties")
                      // 严格校验配置文件存在性
                      if (!propsFile.exists()) {
                          throw new GradleException("Signing config file not found: ${propsFile.absolutePath}")
                      }
                      // 加载配置（处理编码问题）
                      def props = new Properties()
                      props.load(new FileInputStream(propsFile))
                      // 绝对路径加载Keystore（核心修复）
                      storeFile file(props.getProperty("storeFile").trim())
                      storePassword props.getProperty("storePassword").trim()
                      keyAlias props.getProperty("keyAlias").trim()
                      keyPassword props.getProperty("keyPassword").trim()
                      // 日志输出（仅调试，无敏感信息）
                      logger.lifecycle("Using Keystore: ${storeFile.absolutePath}")
                      logger.lifecycle("Using Key Alias: ${keyAlias}")
                  }
              }
              buildTypes {
                  release {
                      // 强制绑定签名配置
                      signingConfig signingConfigs.release
                      // 关闭混淆/压缩（避免新手踩坑）
                      minifyEnabled false
                      shrinkResources false
                      // 关闭增量构建（避免缓存）
                      incremental false
                  }
              }
          }
          EOF
          # 验证build.gradle修改成功
          if ! grep -q "signingConfigs" build.gradle; then
            echo "ERROR: Signing config not injected!"
            exit 1
          fi

      # 步骤6：构建签名APK（带完整日志+错误捕获）
      - name: Build Signed APK
        run: |
          cd android
          # 赋予gradlew执行权限（避免权限不足）
          chmod +x gradlew
          # 构建（带详细日志，失败则打印堆栈）
          ./gradlew assembleRelease --info --stacktrace \
            -PsigningProperties=signing.properties \
            -Dorg.gradle.jvmargs=-Xmx2048m # 增加内存（避免OOM）
          # 验证APK是否生成
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "${APK_PATH}" ]; then
            echo "ERROR: Signed APK not generated!"
            exit 1
          fi
          # 重命名APK（确保文件名唯一）
          mv "${APK_PATH}" "app/build/outputs/apk/release/HCV-authenticator.apk"
          # 打印APK信息
          echo "APK generated: $(realpath app/build/outputs/apk/release/HCV-authenticator.apk)"

      # 步骤7：上传APK产物（指定完整路径）
      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: HCV-authenticator.apk
          path: android/app/build/outputs/apk/release/HCV-authenticator.apk
          # 保留90天（默认仅90天，按需调整）
          retention-days: 90

      # 步骤8：安全清理（无论成败都执行）
      - name: Secure Cleanup
        if: always()
        run: |
          # 删除Keystore和配置文件（避免泄露）
          rm -f android/your_keystore.keystore
          rm -f android/signing.properties
          # 验证清理结果
          if [ -f "android/your_keystore.keystore" ]; then
            echo "WARNING: Keystore cleanup failed!"
          fi
